<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clinic Monitor — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --white:#ffffff; --bg:#f9f9f9; --line:#e5e5e5; --text:#000000; --muted:#808080;
    --brand:#004172;
    --high-bg:#ffdbdb; --high-fg:#d82525;
    --shadow-card: 0 2px 10px rgba(0,65,114,.08), inset 0 0 2px rgba(0,65,114,.12);
    --font-ui: 'Geist', -apple-system, 'Segoe UI', Roboto, sans-serif;
    --font-body: 'Inter', -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  *{box-sizing:border-box}
  html{height:100%}
  body{margin:0;padding:0;min-height:100%;background:var(--bg);color:var(--text);
    font:13px/1.4 var(--font-ui);display:flex;align-items:center;justify-content:center}
  .card{width:100%;max-width:360px;background:var(--white);border-radius:16px;
    box-shadow:var(--shadow-card);padding:32px 28px;display:flex;flex-direction:column;gap:20px}
  .brand{text-align:center}
  .brand .name{font-size:18px;font-weight:600;margin:0}
  .brand .sub{font-size:12px;color:var(--muted);margin:2px 0 0}
  .field{display:flex;flex-direction:column;gap:6px}
  .field label{font-size:12px;color:var(--muted)}
  .field input{font:500 14px var(--font-ui);padding:10px 12px;border-radius:8px;
    border:1px solid var(--line);background:var(--white);color:var(--text)}
  .field input:focus{outline:2px solid var(--brand);outline-offset:-1px}
  .submit{font:600 14px var(--font-ui);padding:11px 16px;border-radius:8px;
    border:1px solid var(--brand);background:var(--brand);color:#fff;cursor:pointer}
  .submit:hover{opacity:.92}
  .error{background:var(--high-bg);color:var(--high-fg);padding:8px 12px;
    border-radius:8px;font-size:12px}
  .note{text-align:center;color:var(--muted);font-size:12px}
</style>
</head>
<body>
  <form class="card" method="post">
    <div class="brand">
      <p class="name">CureBay</p>
      <p class="sub">Clinic Monitor</p>
    </div>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required autofocus autocomplete="username">
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required autocomplete="current-password">
    </div>
    <button class="submit" type="submit">Sign in</button>
    <p class="note">Contact your Admin for access.</p>
  </form>
</body>
</html>
